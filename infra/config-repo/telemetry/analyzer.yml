spring:
  jpa:
    hibernate.ddl-auto: none
    properties.hibernate.format_sql: true
  sql.init.mode: always
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/smart-home
    username: db-user
    password: 12345

grpc:
  client:
    hub-router:
      address: 'static://localhost:59090'
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext

kafka:
  consumers:
    snapshots:
      topic: telemetry.snapshots.v1
      group-id: snapshots-group
      max-poll-records: 100
      deserializer: SNAPSHOT
    hubs:
      topic: telemetry.hubs.v1
      group-id: hubs-group
      max-poll-records: 50
      deserializer: HUB

logging:
  level:
    ru.practicum.telemetry.analyzer: DEBUG