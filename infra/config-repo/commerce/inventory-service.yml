server:
  port: 0

spring:
  jpa:
    hibernate.ddl-auto: none
    properties.hibernate.format_sql: true
  sql.init.mode: always
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5434/inventory-service
    username: db-user
    password: 12345
  cloud.openfeign.client.config:
    default:
      connectTimeout: 2000
      readTimeout: 3000
      loggerLevel: basic

logging:
  level:
    ru.yandex.practicum.inventory: DEBUG